name: probe
on:
  issue_comment:
    types: [created]
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - name: dump
        run: |
          echo "event_name=[${{ github.event_name }}]"
          echo "issue_number=[${{ github.event.issue.number }}]"
          echo "pr_null=[${{ github.event.issue.pull_request == null }}]"
          echo "pr_raw=[${{ github.event.issue.pull_request }}]"
          echo "body=[${{ github.event.issue.comment.body }}]"
          echo "body_eq=[${{ github.event.issue.comment.body == '/attack' }}]"
          echo "has_issue=[${{ github.event.issue != null }}]"
          echo "and_test=[${{ github.event.issue.pull_request == null && github.event.issue.comment.body == 'probe' }}]"
